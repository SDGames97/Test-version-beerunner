<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taktik der Rosen - Next-Gen Edition</title>
    
    <!-- PWA Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Taktik Rosen">
    <meta name="theme-color" content="#030712">

    <!-- Tailwind CSS & Three.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030712;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(245, 158, 11, 0.5);
            box-shadow: 0 20px 30px -10px rgba(245, 158, 11, 0.3);
        }
        .selected-card {
            border: 2px solid #f59e0b !important;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.6), 0 20px 30px -10px rgba(0, 0, 0, 0.7) !important;
            transform: translateY(-8px);
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .glow-text {
            animation: pulseGlow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="text-white relative">

    <!-- High-End 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer flex flex-col justify-between p-4">
        
        <!-- TOP: Glassmorphism Status Bar -->
        <div class="flex justify-between items-center glass-panel p-3.5 rounded-2xl shadow-2xl interactive">
            <div>
                <h1 class="text-sm sm:text-base font-extrabold text-amber-400 tracking-wider">TAKTIK DER ROSEN</h1>
                <p id="turn-indicator" class="text-xs text-slate-300 font-medium">Dein Zug (Beschwörungsphase)</p>
            </div>
            <div class="flex gap-3 text-center">
                <div class="glass-panel px-3 py-1.5 rounded-xl border border-white/5">
                    <span class="text-[10px] text-slate-400 block tracking-wider">SPIELER LP</span>
                    <span id="player-lp" class="font-bold text-emerald-400 text-sm sm:text-base">4000</span>
                </div>
                <div class="glass-panel px-3 py-1.5 rounded-xl border border-white/5">
                    <span class="text-[10px] text-slate-400 block tracking-wider">SP</span>
                    <span id="player-sp" class="font-bold text-amber-300 text-sm sm:text-base">3 / 3</span>
                </div>
                <div class="glass-panel px-3 py-1.5 rounded-xl border border-white/5">
                    <span class="text-[10px] text-slate-400 block tracking-wider">GEGNER LP</span>
                    <span id="enemy-lp" class="font-bold text-rose-400 text-sm sm:text-base">4000</span>
                </div>
            </div>
            <div>
                <button id="end-turn-btn" onclick="endPlayerTurn()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-xs sm:text-sm px-4 py-2 rounded-xl shadow-lg transition transform active:scale-95">
                    Zug Beenden
                </button>
            </div>
        </div>

        <!-- CENTER: Cinematic Message Banner -->
        <div class="self-center glass-panel px-5 py-2 rounded-full text-xs sm:text-sm text-amber-200 text-center shadow-2xl pointer-events-none max-w-lg border border-amber-500/30">
            <span id="game-message" class="glow-text">Wähle eine Handkarte und platziere sie auf einem blauen Feld!</span>
        </div>

        <!-- BOTTOM: Glassmorphic Hand Cards -->
        <div class="interactive flex flex-col items-center">
            <div id="hand-container" class="flex justify-center gap-3 overflow-x-auto py-3 px-4 glass-panel rounded-2xl max-w-4xl w-full shadow-2xl">
                <!-- Cards render dynamically -->
            </div>
        </div>

    </div>

    <!-- Next-Gen Game Script -->
    <script>
        // --- AUDIO SYNTHESIS (Cinematic Web Audio) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playCinematicSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'summon') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'attack') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // --- GAME DATA & CONFIG ---
        const TERRAIN = {
            NORMAL: { name: 'Normal', color: 0x475569, roughness: 0.6, metalness: 0.1 },
            FIRE: { name: 'Feuer', color: 0xef4444, emissive: 0xb91c1c, roughness: 0.3, metalness: 0.2 },
            WATER: { name: 'Wasser', color: 0x0284c7, roughness: 0.1, metalness: 0.8 },
            EARTH: { name: 'Erde', color: 0x15803d, roughness: 0.8, metalness: 0.05 },
            ROCK: { name: 'Felsen', color: 0x1e293b, roughness: 0.9, metalness: 0.4 },
            ABYSS: { name: 'Abgrund', color: 0x581c87, emissive: 0x3b0764, roughness: 0.4, metalness: 0.5 }
        };

        const CARD_TYPES = { FIRE: 'Feuer', WATER: 'Wasser', EARTH: 'Erde', WARRIOR: 'Krieger', BEAST: 'Bestie' };

        const DECK_DATA = [
            { id: 1, name: 'Glut-Welpe', type: CARD_TYPES.FIRE, atk: 1200, def: 1000 },
            { id: 2, name: 'Quell-Nymphe', type: CARD_TYPES.WATER, atk: 1100, def: 1300 },
            { id: 3, name: 'Stein-Golem', type: CARD_TYPES.EARTH, atk: 1000, def: 2000 },
            { id: 4, name: 'Wald-Hüter', type: CARD_TYPES.EARTH, atk: 1400, def: 1200 },
            { id: 5, name: 'Sturmvogel', type: CARD_TYPES.BEAST, atk: 1300, def: 900 },
            { id: 6, name: 'Kristall-Schildkröte', type: CARD_TYPES.WATER, atk: 900, def: 1800 },
            { id: 7, name: 'Phantom-Ritter', type: CARD_TYPES.WARRIOR, atk: 1600, def: 1200 },
            { id: 8, name: 'Schatten-Krabbler', type: CARD_TYPES.BEAST, atk: 1100, def: 800 }
        ];

        const MAP_LAYOUT = [
            [4, 0, 1, 1, 0, 2, 2, 4],
            [0, 0, 1, 0, 0, 2, 0, 0],
            [3, 3, 0, 5, 5, 0, 3, 3],
            [4, 0, 5, 0, 0, 5, 0, 4],
            [4, 0, 5, 0, 0, 5, 0, 4],
            [3, 3, 0, 5, 5, 0, 3, 3],
            [0, 0, 2, 0, 0, 1, 0, 0],
            [4, 2, 2, 0, 0, 1, 1, 4]
        ];

        let scene, camera, renderer, raycaster, mouse;
        let boardGrid = [], boardMeshes = [], unitMeshes = [];
        let playerHand = [];
        let playerLP = 4000, enemyLP = 4000;
        let playerSP = 3, maxSP = 3;
        let isPlayerTurn = true;
        let selectedHandIndex = null;
        let selectedFieldUnit = null;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.025);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 12);
            camera.lookAt(0, 0, 0);

            // High-End Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // Cinematic Studio Lighting
            const ambientLight = new THREE.AmbientLight(0x1e293b, 1.2);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffbeb, 2.0);
            sunLight.position.set(10, 25, 15);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 50;
            const d = 10;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);

            // Accent Rim Light
            const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.0);
            rimLight.position.set(-10, 15, -15);
            scene.add(rimLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            playerHand = [...DECK_DATA.slice(0, 4)];
            buildHighEndBoard();
            spawnLeaders();
            updateUI();

            window.addEventListener('resize', onResize);
            window.addEventListener('pointerdown', handlePointerDown);

            animate();
        }

        function buildHighEndBoard() {
            const size = 1.2;
            const offset = -3.5 * size;

            for (let x = 0; x < 8; x++) {
                boardGrid[x] = [];
                boardMeshes[x] = [];
                for (let y = 0; y < 8; y++) {
                    const code = MAP_LAYOUT[y][x];
                    let t = TERRAIN.NORMAL;
                    if (code === 1) t = TERRAIN.FIRE;
                    if (code === 2) t = TERRAIN.WATER;
                    if (code === 3) t = TERRAIN.EARTH;
                    if (code === 4) t = TERRAIN.ROCK;
                    if (code === 5) t = TERRAIN.ABYSS;

                    boardGrid[x][y] = { x, y, terrain: t, unit: null };

                    let geom, mat;
                    if (t === TERRAIN.ROCK) {
                        geom = new THREE.ConeGeometry(0.55, 1.4, 6);
                        mat = new THREE.MeshStandardMaterial({ color: t.color, roughness: t.roughness, metalness: t.metalness });
                    } else if (t === TERRAIN.WATER) {
                        geom = new THREE.BoxGeometry(size * 0.95, 0.12, size * 0.95);
                        mat = new THREE.MeshPhysicalMaterial({ color: t.color, roughness: t.roughness, metalness: t.metalness, transmission: 0.6, transparent: true, opacity: 0.9 });
                    } else {
                        geom = new THREE.BoxGeometry(size * 0.95, 0.18, size * 0.95);
                        mat = new THREE.MeshStandardMaterial({ 
                            color: t.color, 
                            roughness: t.roughness, 
                            metalness: t.metalness,
                            emissive: t.emissive || 0x000000,
                            emissiveIntensity: t.emissive ? 0.4 : 0
                        });
                    }

                    const mesh = new THREE.Mesh(geom, mat);
                    mesh.position.set(offset + x * size, t === TERRAIN.ROCK ? 0.7 : 0, offset + y * size);
                    mesh.receiveShadow = true;
                    mesh.castShadow = (t === TERRAIN.ROCK);
                    mesh.userData = { gridX: x, gridY: y, isTile: true };

                    scene.add(mesh);
                    boardMeshes[x][y] = mesh;
                }
            }
        }

        function spawnLeaders() {
            boardGrid[3][7].unit = { name: 'Königlicher Paladin', atk: 2000, def: 2000, owner: 'player', isLeader: true };
            boardGrid[4][0].unit = { name: 'Schatten-Imperator', atk: 2000, def: 2000, owner: 'enemy', isLeader: true };
            renderUnits();
        }

        function renderUnits() {
            unitMeshes.forEach(m => scene.remove(m.mesh));
            unitMeshes = [];

            const size = 1.2;
            const offset = -3.5 * size;

            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    const unit = boardGrid[x][y].unit;
                    if (unit) {
                        const group = new THREE.Group();

                        // High-End PBR Cylinder Base
                        const baseGeo = new THREE.CylinderGeometry(0.4, 0.45, 0.25, 32);
                        const baseMat = new THREE.MeshStandardMaterial({
                            color: unit.owner === 'player' ? 0x2563eb : 0xdc2626,
                            metalness: 0.6,
                            roughness: 0.2
                        });
                        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
                        baseMesh.position.y = 0.25;
                        baseMesh.castShadow = true;
                        group.add(baseMesh);

                        // Metallic Crystal / Token Top
                        const topGeo = unit.isLeader ? new THREE.OctahedronGeometry(0.35) : new THREE.BoxGeometry(0.4, 0.4, 0.4);
                        const topMat = new THREE.MeshStandardMaterial({
                            color: unit.isLeader ? 0xf59e0b : 0xf8fafc,
                            metalness: 0.8,
                            roughness: 0.1,
                            emissive: unit.isLeader ? 0xd97706 : 0x000000,
                            emissiveIntensity: unit.isLeader ? 0.5 : 0
                        });
                        const topMesh = new THREE.Mesh(topGeo, topMat);
                        topMesh.position.y = 0.75;
                        topMesh.castShadow = true;
                        group.add(topMesh);

                        group.position.set(offset + x * size, 0, offset + y * size);
                        group.userData = { gridX: x, gridY: y, isUnit: true };

                        scene.add(group);
                        unitMeshes.push({ x, y, mesh: group });
                    }
                }
            }
        }

        function handlePointerDown(e) {
            if (e.clientY > window.innerHeight - 170 || e.clientY < 70) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            let targets = [];
            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    targets.push(boardMeshes[x][y]);
                }
            }
            unitMeshes.forEach(u => targets.push(u.mesh));

            const intersects = raycaster.intersectObjects(targets, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj && !obj.userData.isTile && !obj.userData.isUnit && obj.parent) {
                    obj = obj.parent;
                }

                if (obj && obj.userData) {
                    processGridClick(obj.userData.gridX, obj.userData.gridY);
                }
            }
        }

        function processGridClick(x, y) {
            if (!isPlayerTurn) return;
            const target = boardGrid[x][y];

            if (selectedHandIndex !== null) {
                if (!target.unit && isAdjacentToPlayer(x, y) && target.terrain !== TERRAIN.ROCK) {
                    if (playerSP < 1) {
                        setMessage("Nicht genügend SP!");
                        return;
                    }

                    const card = playerHand[selectedHandIndex];
                    target.unit = { name: card.name, atk: card.atk, def: card.def, owner: 'player' };

                    playerHand.splice(selectedHandIndex, 1);
                    selectedHandIndex = null;
                    playerSP -= 1;

                    playCinematicSound('summon');
                    renderUnits();
                    resetHighlights();
                    updateUI();
                    setMessage(`"${target.unit.name}" erfolgreich beschworen!`);
                } else {
                    setMessage("Ungültiges Beschwörungsfeld!");
                }
                return;
            }

            if (target.unit && target.unit.owner === 'player') {
                selectedFieldUnit = { x, y };
                playCinematicSound('select');
                highlightMoveFields(x, y);
                setMessage(`"${target.unit.name}" ausgewählt. Wähle ein Zielfeld.`);
                return;
            }

            if (selectedFieldUnit) {
                const sx = selectedFieldUnit.x, sy = selectedFieldUnit.y;
                const dist = Math.abs(x - sx) + Math.abs(y - sy);

                if (dist === 1 && target.terrain !== TERRAIN.ROCK) {
                    const myUnit = boardGrid[sx][sy].unit;

                    if (target.unit && target.unit.owner === 'enemy') {
                        playCinematicSound('attack');
                        if (target.unit.isLeader) {
                            enemyLP -= myUnit.atk;
                            setMessage(`Direktangriff auf Anführer! -${myUnit.atk} LP`);
                            if (enemyLP <= 0) {
                                alert("SIEG! Du hast den Gegner vernichtet!");
                                location.reload();
                            }
                        } else {
                            if (myUnit.atk >= target.unit.atk) {
                                setMessage(`Gegnerisches "${target.unit.name}" vernichtet!`);
                                target.unit = myUnit;
                                boardGrid[sx][sy].unit = null;
                            } else {
                                setMessage("Angriff gescheitert! Einheit verloren.");
                                boardGrid[sx][sy].unit = null;
                            }
                        }
                    } else if (!target.unit) {
                        if (target.terrain === TERRAIN.ABYSS && myUnit.atk > 1500) {
                            setMessage(`"${myUnit.name}" wurde vom Abgrund verschlungen (>1500 ATK)!`);
                            boardGrid[sx][sy].unit = null;
                        } else {
                            playCinematicSound('select');
                            target.unit = myUnit;
                            boardGrid[sx][sy].unit = null;
                            setMessage("Einheit bewegt.");
                        }
                    }

                    selectedFieldUnit = null;
                    renderUnits();
                    resetHighlights();
                    updateUI();
                } else {
                    setMessage("Ziel zu weit entfernt!");
                }
            }
        }

        function isAdjacentToPlayer(x, y) {
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) {
                        if (boardGrid[nx][ny].unit && boardGrid[nx][ny].unit.owner === 'player') return true;
                    }
                }
            }
            return false;
        }

        function highlightMoveFields(sx, sy) {
            resetHighlights();
            [[0,1], [0,-1], [1,0], [-1,0]].forEach(d => {
                const nx = sx + d[0], ny = sy + d[1];
                if (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) {
                    if (boardGrid[nx][ny].terrain !== TERRAIN.ROCK) {
                        boardMeshes[nx][ny].material.color.setHex(0x10b981); // Emerald highlight
                    }
                }
            });
        }

        function resetHighlights() {
            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    boardMeshes[x][y].material.color.setHex(boardGrid[x][y].terrain.color);
                }
            }
        }

        function selectCard(index) {
            if (selectedHandIndex === index) {
                selectedHandIndex = null;
                resetHighlights();
                setMessage("Karte abgewählt.");
            } else {
                selectedHandIndex = index;
                selectedFieldUnit = null;
                playCinematicSound('select');
                setMessage(`"${playerHand[index].name}" gewählt. Platziere sie auf dem Feld!`);
            }
            updateUI();
        }

        function endPlayerTurn() {
            if (!isPlayerTurn) return;
            isPlayerTurn = false;
            selectedHandIndex = null;
            selectedFieldUnit = null;
            resetHighlights();
            setMessage("Gegner ist am Zug...");
            updateUI();

            setTimeout(executeAITurn, 1200);
        }

        function executeAITurn() {
            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    const u = boardGrid[x][y].unit;
                    if (u && u.owner === 'enemy') {
                        if (y < 7 && !boardGrid[x][y+1].unit && boardGrid[x][y+1].terrain !== TERRAIN.ROCK) {
                            boardGrid[x][y+1].unit = u;
                            boardGrid[x][y].unit = null;
                            break;
                        }
                    }
                }
            }

            isPlayerTurn = true;
            playerSP = maxSP;
            renderUnits();
            updateUI();
            setMessage("Dein Zug!");
        }

        function updateUI() {
            document.getElementById('player-lp').innerText = playerLP;
            document.getElementById('enemy-lp').innerText = enemyLP;
            document.getElementById('player-sp').innerText = `${playerSP}/${maxSP}`;
            document.getElementById('turn-indicator').innerText = isPlayerTurn ? "Dein Zug" : "Gegner am Zug";

            const container = document.getElementById('hand-container');
            container.innerHTML = '';

            playerHand.forEach((card, i) => {
                const cardEl = document.createElement('div');
                cardEl.className = `glass-card p-3 w-32 h-36 rounded-2xl cursor-pointer flex flex-col justify-between ${selectedHandIndex === i ? 'selected-card' : ''}`;
                cardEl.onclick = () => selectCard(i);
                cardEl.innerHTML = `
                    <div>
                        <span class="text-[9px] font-bold text-amber-400 uppercase tracking-wider block">${card.type}</span>
                        <h4 class="text-xs font-bold text-white mt-1 leading-tight">${card.name}</h4>
                    </div>
                    <div class="text-[10px] glass-panel p-1.5 rounded-xl border border-white/5">
                        <div class="flex justify-between text-emerald-400"><span>ATK</span><span class="font-bold">${card.atk}</span></div>
                        <div class="flex justify-between text-sky-400"><span>DEF</span><span class="font-bold">${card.def}</span></div>
                    </div>
                `;
                container.appendChild(cardEl);
            });
        }

        function setMessage(msg) {
            document.getElementById('game-message').innerText = msg;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
