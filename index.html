<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Neon Serpent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #02030a;
      overflow: hidden;
      touch-action: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #05081a 0%, #02030a 60%, #000000 100%);
    }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 8px 12px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      text-shadow: 0 0 8px #00ffff;
    }

    #title {
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 14px;
      text-transform: uppercase;
      color: #00ffff;
    }

    #score {
      font-size: 14px;
    }

    /* Virtueller Joystick für Mobile */
    #joystick {
      position: fixed;
      bottom: 16px;
      left: 16px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 255, 0.4);
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
      pointer-events: auto;
      touch-action: none;
    }

    #joystick-inner {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 255, 255, 0.8);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #hint {
      position: fixed;
      bottom: 16px;
      right: 16px;
      max-width: 40%;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="title">NEON SERPENT</div>
    <div id="score">Score: <span id="scoreValue">0</span></div>
  </div>

  <div id="joystick">
    <div id="joystick-inner"></div>
  </div>

  <div id="hint">
    Zieh den Joystick, um deine Neon-Schlange zu steuern.<br />
    Sammle Orbs, wachse und überlebe im Neon-Nebel.
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("scoreValue");
    const joystick = document.getElementById("joystick");
    const joystickInner = document.getElementById("joystick-inner");

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener("resize", () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });

    // Game world
    const worldSize = 3000;
    const player = {
      x: worldSize / 2,
      y: worldSize / 2,
      angle: 0,
      speed: 2.2,
      segments: [],
      baseLength: 40,
      radius: 10,
      color: "#00ffff",
      glowColor: "rgba(0,255,255,0.6)",
      score: 0
    };

    const orbs = [];
    const maxOrbs = 120;

    // Joystick state
    let joystickActive = false;
    let joystickCenter = { x: 0, y: 0 };
    let joystickVector = { x: 0, y: 0 };

    function spawnOrb() {
      const orb = {
        x: Math.random() * worldSize,
        y: Math.random() * worldSize,
        radius: 6 + Math.random() * 6,
        color: randomNeonColor()
      };
      orbs.push(orb);
    }

    function randomNeonColor() {
      const colors = [
        "#00ffff",
        "#ff00ff",
        "#00ff6a",
        "#ffea00",
        "#ff006e"
      ];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    // Hintergrund: Neon-Grid + Partikel
    const bgParticles = [];
    for (let i = 0; i < 80; i++) {
      bgParticles.push({
        x: Math.random() * worldSize,
        y: Math.random() * worldSize,
        radius: 2 + Math.random() * 3,
        alpha: 0.2 + Math.random() * 0.5,
        speed: 0.2 + Math.random() * 0.4
      });
    }

    function updateBgParticles() {
      bgParticles.forEach(p => {
        p.y += p.speed;
        if (p.y > worldSize) {
          p.y = 0;
          p.x = Math.random() * worldSize;
        }
      });
    }

    function drawBackground(cameraX, cameraY) {
      ctx.save();
      ctx.translate(-cameraX + width / 2, -cameraY + height / 2);

      // Neon-Grid
      const gridSpacing = 120;
      ctx.strokeStyle = "rgba(0, 255, 255, 0.08)";
      ctx.lineWidth = 1;

      ctx.beginPath();
      for (let x = 0; x <= worldSize; x += gridSpacing) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, worldSize);
      }
      for (let y = 0; y <= worldSize; y += gridSpacing) {
        ctx.moveTo(0, y);
        ctx.lineTo(worldSize, y);
      }
      ctx.stroke();

      // Partikel
      bgParticles.forEach(p => {
        ctx.beginPath();
        ctx.fillStyle = `rgba(0,255,255,${p.alpha})`;
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    function updatePlayer() {
      // Winkel aus Joystick
      if (joystickActive && (joystickVector.x !== 0 || joystickVector.y !== 0)) {
        player.angle = Math.atan2(joystickVector.y, joystickVector.x);
      }

      player.x += Math.cos(player.angle) * player.speed;
      player.y += Math.sin(player.angle) * player.speed;

      // Begrenzung
      player.x = Math.max(0, Math.min(worldSize, player.x));
      player.y = Math.max(0, Math.min(worldSize, player.y));

      // Segmente aktualisieren
      player.segments.unshift({ x: player.x, y: player.y });
      const maxSegments = player.baseLength + Math.floor(player.score / 10);
      if (player.segments.length > maxSegments) {
        player.segments.pop();
      }
    }

    function drawPlayer(cameraX, cameraY) {
      ctx.save();
      ctx.translate(-cameraX + width / 2, -cameraY + height / 2);

      // Glow
      ctx.shadowColor = player.glowColor;
      ctx.shadowBlur = 20;

      for (let i = 0; i < player.segments.length; i++) {
        const seg = player.segments[i];
        const t = i / player.segments.length;
        const radius = player.radius * (1 - t * 0.6);

        ctx.beginPath();
        ctx.fillStyle = player.color;
        ctx.globalAlpha = 0.9 - t * 0.5;
        ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      // Kopf-Highlight
      ctx.beginPath();
      ctx.fillStyle = "#ffffff";
      ctx.arc(player.x, player.y, player.radius * 0.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function updateOrbs() {
      while (orbs.length < maxOrbs) {
        spawnOrb();
      }

      // Kollisionscheck
      for (let i = orbs.length - 1; i >= 0; i--) {
        const orb = orbs[i];
        const dx = orb.x - player.x;
        const dy = orb.y - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < player.radius + orb.radius + 4) {
          // Einsammeln
          player.score += Math.floor(orb.radius * 2);
          orbs.splice(i, 1);
        }
      }

      scoreEl.textContent = player.score;
    }

    function drawOrbs(cameraX, cameraY) {
      ctx.save();
      ctx.translate(-cameraX + width / 2, -cameraY + height / 2);

      orbs.forEach(orb => {
        ctx.beginPath();
        ctx.fillStyle = orb.color;
        ctx.shadowColor = orb.color;
        ctx.shadowBlur = 12;
        ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.shadowBlur = 0;
      ctx.restore();
    }

    function gameLoop() {
      requestAnimationFrame(gameLoop);

      // Kamera folgt Spieler
      const cameraX = player.x;
      const cameraY = player.y;

      ctx.clearRect(0, 0, width, height);

      updateBgParticles();
      drawBackground(cameraX, cameraY);

      updatePlayer();
      updateOrbs();
      drawOrbs(cameraX, cameraY);
      drawPlayer(cameraX, cameraY);
    }

    // Joystick-Logik (Touch + Maus)
    function getJoystickPos(evt) {
      const rect = joystick.getBoundingClientRect();
      const center = {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
      };

      let clientX, clientY;
      if (evt.touches && evt.touches[0]) {
        clientX = evt.touches[0].clientX;
        clientY = evt.touches[0].clientY;
      } else {
        clientX = evt.clientX;
        clientY = evt.clientY;
      }

      return { center, clientX, clientY };
    }

    function startJoystick(evt) {
      evt.preventDefault();
      joystickActive = true;

      const { center, clientX, clientY } = getJoystickPos(evt);
      joystickCenter = center;

      updateJoystickVector(clientX, clientY);
    }

    function moveJoystick(evt) {
      if (!joystickActive) return;
      evt.preventDefault();

      const { clientX, clientY } = getJoystickPos(evt);
      updateJoystickVector(clientX, clientY);
    }

    function endJoystick(evt) {
      evt.preventDefault();
      joystickActive = false;
      joystickVector = { x: 0, y: 0 };
      joystickInner.style.transform = "translate(-50%, -50%)";
    }

    function updateJoystickVector(clientX, clientY) {
      const dx = clientX - joystickCenter.x;
      const dy = clientY - joystickCenter.y;
      const maxDist = 50;

      let dist = Math.sqrt(dx * dx + dy * dy);
      let nx = dx;
      let ny = dy;

      if (dist > maxDist) {
        const scale = maxDist / dist;
        nx *= scale;
        ny *= scale;
        dist = maxDist;
      }

      joystickVector.x = nx / maxDist;
      joystickVector.y = ny / maxDist;

      joystickInner.style.transform =
        `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
    }

    // Touch Events
    joystick.addEventListener("touchstart", startJoystick, { passive: false });
    joystick.addEventListener("touchmove", moveJoystick, { passive: false });
    joystick.addEventListener("touchend", endJoystick, { passive: false });
    joystick.addEventListener("touchcancel", endJoystick, { passive: false });

    // Optional: Maus-Unterstützung (für Desktop)
    joystick.addEventListener("mousedown", startJoystick);
    window.addEventListener("mousemove", moveJoystick);
    window.addEventListener("mouseup", endJoystick);

    // Initialisierung
    for (let i = 0; i < maxOrbs; i++) {
      spawnOrb();
    }
    gameLoop();
  </script>
</body>
</html>
