<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taktik der Rosen - 32-Bit Edition</title>
    
    <!-- PWA Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Taktik Rosen">
    <meta name="theme-color" content="#090d16">

    <!-- Tailwind CSS & Three.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #090d16;
            font-family: 'Courier New', Courier, monospace; /* Retro Pixel Vibe */
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        .pixel-border {
            border: 3px solid #3b82f6;
            box-shadow: 4px 4px 0px #000;
        }
        .pixel-card {
            border: 2px solid #64748b;
            box-shadow: 3px 3px 0px #000;
        }
        .selected-card {
            border: 3px solid #eab308 !important;
            box-shadow: 0 0 15px #eab308, 3px 3px 0px #000 !important;
            transform: translateY(-6px);
        }
    </style>
</head>
<body class="text-white relative">

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer flex flex-col justify-between p-3">
        
        <!-- TOP: Status Bar -->
        <div class="flex justify-between items-center bg-slate-900/90 p-2 rounded-lg border-2 border-slate-700 shadow-2xl interactive">
            <div>
                <h1 class="text-xs sm:text-sm font-bold text-amber-400 tracking-wider">TAKTIK DER ROSEN</h1>
                <p id="turn-indicator" class="text-[10px] text-slate-300">Dein Zug</p>
            </div>
            <div class="flex gap-2 text-center text-[10px] sm:text-xs">
                <div class="bg-slate-800 px-2 py-1 rounded border border-slate-600">
                    <span class="text-slate-400 block">SPIELER LP</span>
                    <span id="player-lp" class="font-bold text-emerald-400">4000</span>
                </div>
                <div class="bg-slate-800 px-2 py-1 rounded border border-slate-600">
                    <span class="text-slate-400 block">SP</span>
                    <span id="player-sp" class="font-bold text-amber-300">3/3</span>
                </div>
                <div class="bg-slate-800 px-2 py-1 rounded border border-slate-600">
                    <span class="text-slate-400 block">GEGNER LP</span>
                    <span id="enemy-lp" class="font-bold text-rose-400">4000</span>
                </div>
            </div>
            <div>
                <button id="end-turn-btn" onclick="endPlayerTurn()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-3 py-1.5 rounded pixel-border active:scale-95 transition">
                    Zug Beenden
                </button>
            </div>
        </div>

        <!-- CENTER: Game Message Feed -->
        <div class="self-center bg-slate-950/80 border border-slate-700 px-3 py-1.5 rounded text-[11px] text-amber-200 text-center shadow-lg pointer-events-none max-w-md">
            <span id="game-message">Klicke eine Karte oder eine Einheit auf dem Feld an!</span>
        </div>

        <!-- BOTTOM: Hand Cards Container -->
        <div class="interactive flex flex-col items-center">
            <div id="hand-container" class="flex justify-center gap-2 overflow-x-auto py-2 px-3 bg-slate-900/95 rounded-xl border-2 border-slate-700 max-w-3xl w-full">
                <!-- Cards render dynamically -->
            </div>
        </div>

    </div>

    <!-- JavaScript & Game Logic -->
    <script>
        // --- 32-BIT SOUND SYNTHESIZER ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playRetroSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'select') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(880, now + 0.05);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'summon') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.25);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'attack') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // --- GAME CONSTANTS & DATA ---
        const TERRAIN = {
            NORMAL: { name: 'Normal', color: 0x64748b },
            FIRE: { name: 'Feuer', color: 0xd97706 },
            WATER: { name: 'Wasser', color: 0x0284c7 },
            EARTH: { name: 'Erde', color: 0x15803d },
            ROCK: { name: 'Felsen', color: 0x334155 },
            ABYSS: { name: 'Abgrund', color: 0x6b21a8 }
        };

        const CARD_TYPES = { FIRE: 'Feuer', WATER: 'Wasser', EARTH: 'Erde', WARRIOR: 'Krieger', BEAST: 'Bestie' };

        const DECK_DATA = [
            { id: 1, name: 'Glut-Welpe', type: CARD_TYPES.FIRE, atk: 1200, def: 1000 },
            { id: 2, name: 'Quell-Nymphe', type: CARD_TYPES.WATER, atk: 1100, def: 1300 },
            { id: 3, name: 'Stein-Golem', type: CARD_TYPES.EARTH, atk: 1000, def: 2000 },
            { id: 4, name: 'Wald-Hüter', type: CARD_TYPES.EARTH, atk: 1400, def: 1200 },
            { id: 5, name: 'Sturmvogel', type: CARD_TYPES.BEAST, atk: 1300, def: 900 },
            { id: 6, name: 'Kristall-Schildkröte', type: CARD_TYPES.WATER, atk: 900, def: 1800 },
            { id: 7, name: 'Phantom-Ritter', type: CARD_TYPES.WARRIOR, atk: 1600, def: 1200 },
            { id: 8, name: 'Schatten-Krabbler', type: CARD_TYPES.BEAST, atk: 1100, def: 800 }
        ];

        const MAP_LAYOUT = [
            [4, 0, 1, 1, 0, 2, 2, 4],
            [0, 0, 1, 0, 0, 2, 0, 0],
            [3, 3, 0, 5, 5, 0, 3, 3],
            [4, 0, 5, 0, 0, 5, 0, 4],
            [4, 0, 5, 0, 0, 5, 0, 4],
            [3, 3, 0, 5, 5, 0, 3, 3],
            [0, 0, 2, 0, 0, 1, 0, 0],
            [4, 2, 2, 0, 0, 1, 1, 4]
        ];

        // --- GAME STATE ---
        let scene, camera, renderer, raycaster, mouse;
        let boardGrid = [];
        let boardMeshes = [];
        let unitMeshes = [];
        let playerHand = [];
        let playerLP = 4000, enemyLP = 4000;
        let playerSP = 3, maxSP = 3;
        let isPlayerTurn = true;

        let selectedHandIndex = null;
        let selectedFieldUnit = null; // {x, y}

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x090d16, 0.04);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 13, 10);
            camera.lookAt(0, 0, 0);

            // 32-Bit Low-Poly / Retro Renderer Config
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1); // Intentional retro resolution
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.BasicShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambLight);

            const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
            dirLight.position.set(5, 15, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            setupGameData();
            build3DBoard();
            spawnLeaders();
            updateUI();

            window.addEventListener('resize', onResize);
            window.addEventListener('pointerdown', handlePointerDown);

            animate();
        }

        function setupGameData() {
            playerHand = [...DECK_DATA.slice(0, 4)];
        }

        function build3DBoard() {
            const size = 1.2;
            const offset = -3.5 * size;

            for (let x = 0; x < 8; x++) {
                boardGrid[x] = [];
                boardMeshes[x] = [];
                for (let y = 0; y < 8; y++) {
                    const code = MAP_LAYOUT[y][x];
                    let t = TERRAIN.NORMAL;
                    if (code === 1) t = TERRAIN.FIRE;
                    if (code === 2) t = TERRAIN.WATER;
                    if (code === 3) t = TERRAIN.EARTH;
                    if (code === 4) t = TERRAIN.ROCK;
                    if (code === 5) t = TERRAIN.ABYSS;

                    boardGrid[x][y] = { x, y, terrain: t, unit: null };

                    // 32-Bit Low-Poly Tile Meshes
                    let geom = new THREE.BoxGeometry(size * 0.92, 0.2, size * 0.92);
                    if (t === TERRAIN.ROCK) {
                        geom = new THREE.BoxGeometry(size * 0.92, 0.8, size * 0.92);
                    }

                    const mat = new THREE.MeshLambertMaterial({ color: t.color, flatShading: true });
                    const mesh = new THREE.Mesh(geom, mat);
                    mesh.position.set(offset + x * size, t === TERRAIN.ROCK ? 0.3 : 0, offset + y * size);
                    mesh.receiveShadow = true;
                    mesh.userData = { gridX: x, gridY: y, isTile: true };

                    scene.add(mesh);
                    boardMeshes[x][y] = mesh;
                }
            }
        }

        function spawnLeaders() {
            // Player Leader (3, 7)
            const pLeader = { name: 'Königlicher Paladin', atk: 2000, def: 2000, owner: 'player', isLeader: true };
            boardGrid[3][7].unit = pLeader;

            // Enemy Leader (4, 0)
            const eLeader = { name: 'Schatten-Imperator', atk: 2000, def: 2000, owner: 'enemy', isLeader: true };
            boardGrid[4][0].unit = eLeader;

            renderUnits();
        }

        function renderUnits() {
            unitMeshes.forEach(m => scene.remove(m.mesh));
            unitMeshes = [];

            const size = 1.2;
            const offset = -3.5 * size;

            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    const unit = boardGrid[x][y].unit;
                    if (unit) {
                        const group = new THREE.Group();

                        // 32-Bit Retro Cylinder Base
                        const baseGeo = new THREE.CylinderGeometry(0.38, 0.42, 0.25, 8); // Low side count for retro look
                        const baseMat = new THREE.MeshLambertMaterial({
                            color: unit.owner === 'player' ? 0x2563eb : 0xd97706,
                            flatShading: true
                        });
                        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
                        baseMesh.position.y = 0.25;
                        baseMesh.castShadow = true;
                        group.add(baseMesh);

                        // Retro Octahedron / Top Icon
                        const topGeo = unit.isLeader ? new THREE.OctahedronGeometry(0.3) : new THREE.BoxGeometry(0.35, 0.35, 0.35);
                        const topMat = new THREE.MeshLambertMaterial({
                            color: unit.isLeader ? 0xfacc15 : 0xf8fafc,
                            flatShading: true
                        });
                        const topMesh = new THREE.Mesh(topGeo, topMat);
                        topMesh.position.y = 0.65;
                        topMesh.castShadow = true;
                        group.add(topMesh);

                        group.position.set(offset + x * size, 0, offset + y * size);
                        group.userData = { gridX: x, gridY: y, isUnit: true };

                        scene.add(group);
                        unitMeshes.push({ x, y, mesh: group });
                    }
                }
            }
        }

        // --- SELECTION & TOUCH CONTROLS ---
        function handlePointerDown(e) {
            // Ignore UI clicks
            if (e.clientY > window.innerHeight - 170 || e.clientY < 70) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            let targets = [];
            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    targets.push(boardMeshes[x][y]);
                }
            }
            unitMeshes.forEach(u => targets.push(u.mesh));

            const intersects = raycaster.intersectObjects(targets, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj && !obj.userData.isTile && !obj.userData.isUnit && obj.parent) {
                    obj = obj.parent;
                }

                if (obj && obj.userData) {
                    processGridClick(obj.userData.gridX, obj.userData.gridY);
                }
            }
        }

        function processGridClick(x, y) {
            if (!isPlayerTurn) return;
            const target = boardGrid[x][y];

            // 1. SUMMON FROM HAND
            if (selectedHandIndex !== null) {
                if (!target.unit && isAdjacentToPlayer(x, y) && target.terrain !== TERRAIN.ROCK) {
                    if (playerSP < 1) {
                        setMessage("Nicht genügend SP!");
                        return;
                    }

                    const card = playerHand[selectedHandIndex];
                    target.unit = {
                        name: card.name,
                        atk: card.atk,
                        def: card.def,
                        owner: 'player'
                    };

                    playerHand.splice(selectedHandIndex, 1);
                    selectedHandIndex = null;
                    playerSP -= 1;

                    playRetroSound('summon');
                    renderUnits();
                    resetHighlights();
                    updateUI();
                    setMessage(`"${target.unit.name}" beschworen!`);
                } else {
                    setMessage("Ungültiges Beschwörungsfeld!");
                }
                return;
            }

            // 2. SELECT UNIT ON FIELD
            if (target.unit && target.unit.owner === 'player') {
                selectedFieldUnit = { x, y };
                playRetroSound('select');
                highlightMoveFields(x, y);
                setMessage(`"${target.unit.name}" gewählt. Klicke ein angrenzendes Feld an!`);
                return;
            }

            // 3. MOVE OR ATTACK
            if (selectedFieldUnit) {
                const sx = selectedFieldUnit.x;
                const sy = selectedFieldUnit.y;
                const dist = Math.abs(x - sx) + Math.abs(y - sy);

                if (dist === 1 && target.terrain !== TERRAIN.ROCK) {
                    const myUnit = boardGrid[sx][sy].unit;

                    // ATTACK ENEMY
                    if (target.unit && target.unit.owner === 'enemy') {
                        playRetroSound('attack');
                        if (target.unit.isLeader) {
                            enemyLP -= myUnit.atk;
                            setMessage(`Direktangriff auf Anführer! -${myUnit.atk} LP`);
                            if (enemyLP <= 0) {
                                alert("SIEG! Du hast den gegnerischen Anführer vernichtet!");
                                location.reload();
                            }
                        } else {
                            if (myUnit.atk >= target.unit.atk) {
                                setMessage(`Gegnerisches "${target.unit.name}" zerstört!`);
                                target.unit = myUnit;
                                boardGrid[sx][sy].unit = null;
                            } else {
                                setMessage("Dein Angriff war zu schwach! Einheit verloren.");
                                boardGrid[sx][sy].unit = null;
                            }
                        }
                    } 
                    // MOVE TO EMPTY TILE
                    else if (!target.unit) {
                        // Check Abyss
                        if (target.terrain === TERRAIN.ABYSS && myUnit.atk > 1500) {
                            setMessage(`"${myUnit.name}" wurde vom Abgrund verschlungen (>1500 ATK)!`);
                            boardGrid[sx][sy].unit = null;
                        } else {
                            playRetroSound('select');
                            target.unit = myUnit;
                            boardGrid[sx][sy].unit = null;
                            setMessage("Einheit bewegt.");
                        }
                    }

                    selectedFieldUnit = null;
                    renderUnits();
                    resetHighlights();
                    updateUI();
                } else {
                    setMessage("Feld zu weit entfernt!");
                }
            }
        }

        function isAdjacentToPlayer(x, y) {
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) {
                        if (boardGrid[nx][ny].unit && boardGrid[nx][ny].unit.owner === 'player') return true;
                    }
                }
            }
            return false;
        }

        function highlightMoveFields(sx, sy) {
            resetHighlights();
            const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
            dirs.forEach(d => {
                const nx = sx + d[0], ny = sy + d[1];
                if (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) {
                    if (boardGrid[nx][ny].terrain !== TERRAIN.ROCK) {
                        boardMeshes[nx][ny].material.color.setHex(0x22c55e); // Green
                    }
                }
            });
        }

        function resetHighlights() {
            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    boardMeshes[x][y].material.color.setHex(boardGrid[x][y].terrain.color);
                }
            }
        }

        function selectCard(index) {
            if (selectedHandIndex === index) {
                selectedHandIndex = null;
                resetHighlights();
                setMessage("Karte abgewählt.");
            } else {
                selectedHandIndex = index;
                selectedFieldUnit = null;
                playRetroSound('select');
                setMessage(`"${playerHand[index].name}" gewählt. Klicke ein freies Feld neben deinen Einheiten an!`);
            }
            updateUI();
        }

        function endPlayerTurn() {
            if (!isPlayerTurn) return;
            isPlayerTurn = false;
            selectedHandIndex = null;
            selectedFieldUnit = null;
            resetHighlights();
            setMessage("Gegner ist am Zug...");
            updateUI();

            setTimeout(executeAITurn, 1200);
        }

        function executeAITurn() {
            // Simple Enemy AI Action
            let act = false;
            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    const u = boardGrid[x][y].unit;
                    if (u && u.owner === 'enemy' && !act) {
                        // Move down towards player
                        if (y < 7 && !boardGrid[x][y+1].unit && boardGrid[x][y+1].terrain !== TERRAIN.ROCK) {
                            boardGrid[x][y+1].unit = u;
                            boardGrid[x][y].unit = null;
                            act = true;
                        }
                    }
                }
            }

            isPlayerTurn = true;
            playerSP = maxSP;
            renderUnits();
            updateUI();
            setMessage("Dein Zug!");
        }

        function updateUI() {
            document.getElementById('player-lp').innerText = playerLP;
            document.getElementById('enemy-lp').innerText = enemyLP;
            document.getElementById('player-sp').innerText = `${playerSP}/${maxSP}`;
            document.getElementById('turn-indicator').innerText = isPlayerTurn ? "Dein Zug" : "Gegner am Zug";

            const container = document.getElementById('hand-container');
            container.innerHTML = '';

            playerHand.forEach((card, i) => {
                const cardEl = document.createElement('div');
                cardEl.className = `flex flex-col justify-between bg-slate-800 p-2 w-28 h-32 rounded pixel-card cursor-pointer ${selectedHandIndex === i ? 'selected-card' : ''}`;
                cardEl.onclick = () => selectCard(i);
                cardEl.innerHTML = `
                    <div>
                        <span class="text-[9px] text-amber-400 font-bold block">${card.type}</span>
                        <h4 class="text-[11px] font-bold text-white leading-tight">${card.name}</h4>
                    </div>
                    <div class="text-[9px] bg-slate-900 p-1 rounded">
                        <div class="text-emerald-400">ATK: ${card.atk}</div>
                        <div class="text-sky-400">DEF: ${card.def}</div>
                    </div>
                `;
                container.appendChild(cardEl);
            });
        }

        function setMessage(msg) {
            document.getElementById('game-message').innerText = msg;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
