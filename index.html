<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taktik der Rosen - Next-Gen Edition</title>
    
    <!-- PWA Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Taktik Rosen">
    <meta name="theme-color" content="#030712">

    <!-- Tailwind CSS & Three.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030712;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(245, 158, 11, 0.5);
            box-shadow: 0 20px 30px -10px rgba(245, 158, 11, 0.3);
        }
        .selected-card {
            border: 2px solid #f59e0b !important;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.6), 0 20px 30px -10px rgba(0, 0, 0, 0.7) !important;
            transform: translateY(-8px);
        }
        .glow-text {
            animation: pulseGlow 2s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body class="text-white relative">

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer flex flex-col justify-between p-4">
        
        <!-- MAIN MENU OVERLAY -->
        <div id="main-menu" class="absolute inset-0 bg-slate-950/90 backdrop-blur-2xl z-50 flex flex-col justify-center items-center p-6 interactive">
            <div class="glass-panel p-8 rounded-3xl max-w-md w-full text-center border border-amber-500/30 shadow-2xl space-y-6">
                <div>
                    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-200 tracking-wider">TAKTIK DER ROSEN</h1>
                    <p class="text-xs text-slate-400 mt-1">3D Taktik-Kartenspiel</p>
                </div>

                <div class="space-y-3">
                    <button onclick="showNameScreen()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition active:scale-95">
                        Neues Spiel
                    </button>
                    <button onclick="openSettings()" class="w-full glass-panel hover:bg-slate-800 text-white font-bold py-3 rounded-xl border border-white/10 transition active:scale-95">
                        Einstellungen
                    </button>
                </div>
            </div>
        </div>

        <!-- NAME INPUT OVERLAY -->
        <div id="name-screen" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-2xl z-50 flex flex-col justify-center items-center p-6 interactive">
            <div class="glass-panel p-8 rounded-3xl max-w-md w-full text-center border border-amber-500/30 shadow-2xl space-y-6">
                <h2 class="text-xl font-bold text-amber-400">Spielername wählen</h2>
                <input type="text" id="player-name-input" value="Spieler 1" maxlength="16" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-center text-white focus:outline-none focus:border-amber-500 font-semibold">
                <div class="flex gap-3">
                    <button onclick="backToMainMenu()" class="w-1/2 glass-panel hover:bg-slate-800 text-slate-300 font-bold py-3 rounded-xl border border-white/10">
                        Zurück
                    </button>
                    <button onclick="showLevelSelect()" class="w-1/2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg">
                        Weiter
                    </button>
                </div>
            </div>
        </div>

        <!-- LEVEL SELECT OVERLAY -->
        <div id="level-screen" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-2xl z-50 flex flex-col justify-center items-center p-6 interactive">
            <div class="glass-panel p-6 rounded-3xl max-w-2xl w-full text-center border border-amber-500/30 shadow-2xl space-y-4">
                <h2 class="text-xl font-bold text-amber-400">Wähle ein Level (1 - 15)</h2>
                <div id="level-grid" class="grid grid-cols-5 gap-3 max-h-80 overflow-y-auto p-2">
                    <!-- Levels generated -->
                </div>
                <button onclick="backToMainMenu()" class="glass-panel px-6 py-2 rounded-xl text-slate-300 hover:bg-slate-800">
                    Zurück zum Hauptmenü
                </button>
            </div>
        </div>

        <!-- SETTINGS OVERLAY -->
        <div id="settings-screen" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-2xl z-50 flex flex-col justify-center items-center p-6 interactive">
            <div class="glass-panel p-8 rounded-3xl max-w-md w-full border border-amber-500/30 shadow-2xl space-y-6">
                <h2 class="text-xl font-bold text-amber-400 text-center">Einstellungen</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">FPS Limit (Bilder pro Sekunde)</label>
                        <select id="fps-select" onchange="changeFPS(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white">
                            <option value="60" selected>60 FPS (Standard)</option>
                            <option value="120">120 FPS / Uncapped (High Refresh)</option>
                            <option value="30">30 FPS (Energiesparmodus)</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Sound Lautstärke</label>
                        <input type="range" id="sound-volume" min="0" max="100" value="80" onchange="changeVolume(this.value)" class="w-full">
                    </div>
                </div>

                <button onclick="closeSettings()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg">
                    Speichern & Zurück
                </button>
            </div>
        </div>

        <!-- IN-GAME TOP STATUS BAR -->
        <div id="game-ui-top" class="hidden justify-between items-center glass-panel p-3.5 rounded-2xl shadow-2xl interactive">
            <div>
                <h1 id="hud-player-name" class="text-sm font-extrabold text-amber-400 tracking-wider">SPIELER 1</h1>
                <p id="turn-indicator" class="text-xs text-slate-300 font-medium">Dein Zug</p>
            </div>
            <div class="flex gap-3 text-center">
                <div class="glass-panel px-3 py-1.5 rounded-xl border border-white/5">
                    <span class="text-[10px] text-slate-400 block tracking-wider">SPIELER LP</span>
                    <span id="player-lp" class="font-bold text-emerald-400 text-sm">4000</span>
                </div>
                <div class="glass-panel px-3 py-1.5 rounded-xl border border-white/5">
                    <span class="text-[10px] text-slate-400 block tracking-wider">SP</span>
                    <span id="player-sp" class="font-bold text-amber-300 text-sm">3 / 3</span>
                </div>
                <div class="glass-panel px-3 py-1.5 rounded-xl border border-white/5">
                    <span class="text-[10px] text-slate-400 block tracking-wider">GEGNER LP</span>
                    <span id="enemy-lp" class="font-bold text-rose-400 text-sm">4000</span>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="openSettings()" class="glass-panel hover:bg-slate-800 text-xs px-3 py-2 rounded-xl">⚙️</button>
                <button id="end-turn-btn" onclick="endPlayerTurn()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl shadow-lg">
                    Zug Beenden
                </button>
            </div>
        </div>

        <!-- CENTER MESSAGE FEED -->
        <div id="game-ui-msg" class="hidden self-center glass-panel px-5 py-2 rounded-full text-xs text-amber-200 text-center shadow-2xl pointer-events-none max-w-lg border border-amber-500/30">
            <span id="game-message" class="glow-text">Wähle eine Handkarte oder bewege eine deiner Einheiten!</span>
        </div>

        <!-- IN-GAME BOTTOM HAND -->
        <div id="game-ui-bottom" class="hidden interactive flex-col items-center">
            <div id="hand-container" class="flex justify-center gap-3 overflow-x-auto py-3 px-4 glass-panel rounded-2xl max-w-4xl w-full shadow-2xl">
                <!-- Cards render dynamically -->
            </div>
        </div>

    </div>

    <!-- JavaScript & Game Logic -->
    <script>
        // --- AUDIO SYNTHESIS & VOLUME CONTROL ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let soundVolume = 0.8;

        function changeVolume(val) {
            soundVolume = val / 100;
        }

        function playSound(type) {
            if (soundVolume <= 0) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                gain.gain.setValueAtTime(0.2 * soundVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'summon') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.4);
                gain.gain.setValueAtTime(0.3 * soundVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'attack') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.35 * soundVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // --- GAME CONSTANTS & MAP GENERATOR ---
        const TERRAIN = {
            NORMAL: { name: 'Normal', color: 0x475569, roughness: 0.6, metalness: 0.1 },
            FIRE: { name: 'Feuer', color: 0xef4444, emissive: 0xb91c1c, roughness: 0.3, metalness: 0.2 },
            WATER: { name: 'Wasser', color: 0x0284c7, roughness: 0.1, metalness: 0.8 },
            EARTH: { name: 'Erde', color: 0x15803d, roughness: 0.8, metalness: 0.05 },
            ROCK: { name: 'Felsen', color: 0x1e293b, roughness: 0.9, metalness: 0.4 },
            ABYSS: { name: 'Abgrund', color: 0x581c87, emissive: 0x3b0764, roughness: 0.4, metalness: 0.5 }
        };

        const CARD_TYPES = { FIRE: 'Feuer', WATER: 'Wasser', EARTH: 'Erde', WARRIOR: 'Krieger', BEAST: 'Bestie' };

        const DECK_DATA = [
            { id: 1, name: 'Glut-Welpe', type: CARD_TYPES.FIRE, atk: 1200, def: 1000 },
            { id: 2, name: 'Quell-Nymphe', type: CARD_TYPES.WATER, atk: 1100, def: 1300 },
            { id: 3, name: 'Stein-Golem', type: CARD_TYPES.EARTH, atk: 1000, def: 2000 },
            { id: 4, name: 'Wald-Hüter', type: CARD_TYPES.EARTH, atk: 1400, def: 1200 },
            { id: 5, name: 'Sturmvogel', type: CARD_TYPES.BEAST, atk: 1300, def: 900 },
            { id: 6, name: 'Kristall-Schildkröte', type: CARD_TYPES.WATER, atk: 900, def: 1800 },
            { id: 7, name: 'Phantom-Ritter', type: CARD_TYPES.WARRIOR, atk: 1600, def: 1200 },
            { id: 8, name: 'Schatten-Krabbler', type: CARD_TYPES.BEAST, atk: 1100, def: 800 }
        ];

        function generateLevels() {
            const levels = [];
            for (let l = 1; l <= 15; l++) {
                const map = [];
                for (let y = 0; y < 8; y++) {
                    const row = [];
                    for (let x = 0; x < 8; x++) {
                        if ((x === 3 && y === 7) || (x === 4 && y === 0)) {
                            row.push(0);
                            continue;
                        }
                        let rand = Math.random();
                        if (l <= 3) row.push(rand > 0.8 ? 4 : rand > 0.6 ? 3 : 0);
                        else if (l <= 6) row.push(rand > 0.7 ? 1 : rand > 0.5 ? 4 : 0);
                        else if (l <= 9) row.push(rand > 0.7 ? 2 : rand > 0.5 ? 5 : 0);
                        else row.push(Math.floor(Math.random() * 6));
                    }
                    map.push(row);
                }
                levels.push(map);
            }
            return levels;
        }

        const LEVEL_MAPS = generateLevels();

        // --- GAME STATE ---
        let scene, camera, renderer, raycaster, mouse;
        let boardGrid = [], boardMeshes = [], unitMeshes = [];
        let smokeParticles = [];
        let playerHand = [];
        let playerName = "Spieler 1";
        let currentLevel = 1;
        let playerLP = 4000, enemyLP = 4000;
        let playerSP = 3, maxSP = 3;
        let isPlayerTurn = true;
        let selectedHandIndex = null;
        let selectedFieldUnit = null;

        let targetFPS = 60;
        let lastFrameTime = performance.now();

        function changeFPS(val) {
            targetFPS = parseInt(val);
        }

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.025);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 12);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x1e293b, 1.2);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffbeb, 2.0);
            sunLight.position.set(10, 25, 15);
            sunLight.castShadow = true;
            scene.add(sunLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onResize);
            window.addEventListener('pointerdown', handlePointerDown);

            renderLevelGridUI();
            animate(performance.now());
        }

        // --- MENU SYSTEM ---
        function showNameScreen() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('name-screen').classList.remove('hidden');
        }

        function backToMainMenu() {
            document.getElementById('name-screen').classList.add('hidden');
            document.getElementById('level-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function showLevelSelect() {
            playerName = document.getElementById('player-name-input').value || "Spieler 1";
            document.getElementById('hud-player-name').innerText = playerName.toUpperCase();
            document.getElementById('name-screen').classList.add('hidden');
            document.getElementById('level-screen').classList.remove('hidden');
        }

        function renderLevelGridUI() {
            const grid = document.getElementById('level-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 15; i++) {
                const btn = document.createElement('button');
                btn.className = "glass-panel hover:bg-amber-500 hover:text-slate-950 text-white font-bold py-3 rounded-xl transition border border-white/10 active:scale-95";
                btn.innerText = `Lvl ${i}`;
                btn.onclick = () => startLevel(i);
                grid.appendChild(btn);
            }
        }

        function openSettings() {
            document.getElementById('settings-screen').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-screen').classList.add('hidden');
        }

        function startLevel(lvlIndex) {
            currentLevel = lvlIndex;
            document.getElementById('level-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.add('hidden');

            document.getElementById('game-ui-top').classList.remove('hidden');
            document.getElementById('game-ui-top').classList.add('flex');
            document.getElementById('game-ui-msg').classList.remove('hidden');
            document.getElementById('game-ui-bottom').classList.remove('hidden');
            document.getElementById('game-ui-bottom').classList.add('flex');

            playerHand = [...DECK_DATA.slice(0, 4)];
            playerLP = 4000;
            enemyLP = 4000;
            playerSP = maxSP;

            buildLevelBoard(lvlIndex - 1);
            spawnLeaders();
            resetTurnFlags();
            updateUI();
            setMessage(`Level ${currentLevel} gestartet! Du bist am Zug.`);
        }

        function buildLevelBoard(levelIdx) {
            boardMeshes.forEach(row => row.forEach(m => scene.remove(m)));
            smokeParticles.forEach(p => scene.remove(p));
            smokeParticles = [];
            boardGrid = [];
            boardMeshes = [];

            const layout = LEVEL_MAPS[levelIdx];
            const size = 1.2;
            const offset = -3.5 * size;

            for (let x = 0; x < 8; x++) {
                boardGrid[x] = [];
                boardMeshes[x] = [];
                for (let y = 0; y < 8; y++) {
                    const code = layout[y][x];
                    let t = TERRAIN.NORMAL;
                    if (code === 1) t = TERRAIN.FIRE;
                    if (code === 2) t = TERRAIN.WATER;
                    if (code === 3) t = TERRAIN.EARTH;
                    if (code === 4) t = TERRAIN.ROCK;
                    if (code === 5) t = TERRAIN.ABYSS;

                    boardGrid[x][y] = { x, y, terrain: t, unit: null };

                    let geom = new THREE.BoxGeometry(size * 0.95, t === TERRAIN.ROCK ? 0.8 : 0.18, size * 0.95);
                    let mat = new THREE.MeshStandardMaterial({ 
                        color: t.color, 
                        roughness: t.roughness, 
                        metalness: t.metalness,
                        emissive: t.emissive || 0x000000,
                        emissiveIntensity: t.emissive ? 0.5 : 0
                    });

                    const mesh = new THREE.Mesh(geom, mat);
                    const posX = offset + x * size;
                    const posZ = offset + y * size;
                    mesh.position.set(posX, t === TERRAIN.ROCK ? 0.4 : 0, posZ);
                    mesh.receiveShadow = true;
                    mesh.userData = { gridX: x, gridY: y, isTile: true };

                    scene.add(mesh);
                    boardMeshes[x][y] = mesh;

                    // QUALMEFFEKTE FÜR FEUERFELDER
                    if (t === TERRAIN.FIRE) {
                        for (let p = 0; p < 2; p++) {
                            const pGeo = new THREE.DodecahedronGeometry(0.08 + Math.random() * 0.05);
                            const pMat = new THREE.MeshBasicMaterial({
                                color: 0x444444,
                                transparent: true,
                                opacity: 0.4
                            });
                            const pMesh = new THREE.Mesh(pGeo, pMat);
                            pMesh.position.set(posX + (Math.random() - 0.5) * 0.8, 0.3 + Math.random() * 0.5, posZ + (Math.random() - 0.5) * 0.8);
                            scene.add(pMesh);
                            smokeParticles.push({ mesh: pMesh, originY: pMesh.position.y });
                        }
                    }
                }
            }
        }

        function spawnLeaders() {
            boardGrid[3][7].unit = { name: 'Königlicher Paladin', atk: 2000, def: 2000, owner: 'player', isLeader: true, hasMoved: false };
            boardGrid[4][0].unit = { name: 'Schatten-Imperator', atk: 2000, def: 2000, owner: 'enemy', isLeader: true, hasMoved: false };
            renderUnits();
        }

        function resetTurnFlags() {
            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    if (boardGrid[x][y].unit) {
                        boardGrid[x][y].unit.hasMoved = false;
                    }
                }
            }
        }

        function renderUnits() {
            unitMeshes.forEach(m => scene.remove(m.mesh));
            unitMeshes = [];

            const size = 1.2;
            const offset = -3.5 * size;

            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    const unit = boardGrid[x][y].unit;
                    if (unit) {
                        const group = new THREE.Group();

                        const baseGeo = new THREE.CylinderGeometry(0.4, 0.45, 0.25, 32);
                        const baseMat = new THREE.MeshStandardMaterial({
                            color: unit.owner === 'player' ? (unit.hasMoved ? 0x64748b : 0x2563eb) : 0xdc2626,
                            metalness: 0.6, roughness: 0.2
                        });
                        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
                        baseMesh.position.y = 0.25;
                        baseMesh.castShadow = true;
                        group.add(baseMesh);

                        const topGeo = unit.isLeader ? new THREE.OctahedronGeometry(0.35) : new THREE.BoxGeometry(0.4, 0.4, 0.4);
                        const topMat = new THREE.MeshStandardMaterial({
                            color: unit.isLeader ? 0xf59e0b : 0xf8fafc,
                            metalness: 0.8, roughness: 0.1
                        });
                        const topMesh = new THREE.Mesh(topGeo, topMat);
                        topMesh.position.y = 0.75;
                        topMesh.castShadow = true;
                        group.add(topMesh);

                        group.position.set(offset + x * size, 0, offset + y * size);
                        group.userData = { gridX: x, gridY: y, isUnit: true };

                        scene.add(group);
                        unitMeshes.push({ x, y, mesh: group });
                    }
                }
            }
        }

        // --- STRIKTE 1-BEWEGUNG PRO RUNDE RULE & INTERACTION ---
        function handlePointerDown(e) {
            if (e.clientY > window.innerHeight - 170 || e.clientY < 70) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            let targets = [];
            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    if (boardMeshes[x] && boardMeshes[x][y]) targets.push(boardMeshes[x][y]);
                }
            }
            unitMeshes.forEach(u => targets.push(u.mesh));

            const intersects = raycaster.intersectObjects(targets, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj && !obj.userData.isTile && !obj.userData.isUnit && obj.parent) {
                    obj = obj.parent;
                }

                if (obj && obj.userData) {
                    processGridClick(obj.userData.gridX, obj.userData.gridY);
                }
            }
        }

        function processGridClick(x, y) {
            if (!isPlayerTurn) return;
            const target = boardGrid[x][y];

            // 1. BESCHWÖREN
            if (selectedHandIndex !== null) {
                if (!target.unit && isAdjacentToPlayer(x, y) && target.terrain !== TERRAIN.ROCK) {
                    if (playerSP < 1) {
                        setMessage("Nicht genügend SP!");
                        return;
                    }

                    const card = playerHand[selectedHandIndex];
                    target.unit = { name: card.name, atk: card.atk, def: card.def, owner: 'player', hasMoved: true }; // Neu beschworene Monster dürfen erst nächste Runde bewegen!

                    playerHand.splice(selectedHandIndex, 1);
                    selectedHandIndex = null;
                    playerSP -= 1;

                    playSound('summon');
                    renderUnits();
                    resetHighlights();
                    updateUI();
                    setMessage(`"${target.unit.name}" beschworen!`);
                } else {
                    setMessage("Beschwören nur auf freie Nachbarfelder möglich!");
                }
                return;
            }

            // 2. EINHEIT AUSWÄHLEN (PRÜFUNG OB DIESE RUNDE BEREITS BEWEGT)
            if (target.unit && target.unit.owner === 'player') {
                if (target.unit.hasMoved) {
                    setMessage(`"${target.unit.name}" wurde in diesem Zug bereits bewegt!`);
                    return;
                }
                selectedFieldUnit = { x, y };
                playSound('select');
                highlightMoveFields(x, y);
                setMessage(`"${target.unit.name}" gewählt (Maximal 1 Feld Bewegung).`);
                return;
            }

            // 3. MAXIMAL 1 FELD BEWEGEN ODER ANGREIFEN
            if (selectedFieldUnit) {
                const sx = selectedFieldUnit.x, sy = selectedFieldUnit.y;
                const dist = Math.abs(x - sx) + Math.abs(y - sy);

                if (dist === 1 && target.terrain !== TERRAIN.ROCK) { // EXAKT 1 FELD
                    const myUnit = boardGrid[sx][sy].unit;

                    if (target.unit && target.unit.owner === 'enemy') {
                        playSound('attack');
                        if (target.unit.isLeader) {
                            enemyLP -= myUnit.atk;
                            setMessage(`Direktangriff auf Anführer! -${myUnit.atk} LP`);
                            if (enemyLP <= 0) {
                                alert(`SIEG! Level ${currentLevel} abgeschlossen!`);
                                backToMainMenu();
                            }
                        } else {
                            if (myUnit.atk >= target.unit.atk) {
                                setMessage(`Gegnerisches "${target.unit.name}" vernichtet!`);
                                myUnit.hasMoved = true;
                                target.unit = myUnit;
                                boardGrid[sx][sy].unit = null;
                            } else {
                                setMessage("Eigene Einheit besiegt.");
                                boardGrid[sx][sy].unit = null;
                            }
                        }
                    } else if (!target.unit) {
                        if (target.terrain === TERRAIN.ABYSS && myUnit.atk > 1500) {
                            setMessage(`"${myUnit.name}" wurde vom Abgrund verschlungen (>1500 ATK)!`);
                            boardGrid[sx][sy].unit = null;
                        } else {
                            playSound('select');
                            myUnit.hasMoved = true; // JETZT FÜR DIESEN ZUG GESPERRT!
                            target.unit = myUnit;
                            boardGrid[sx][sy].unit = null;
                            setMessage("Einheit 1 Feld bewegt.");
                        }
                    }

                    selectedFieldUnit = null;
                    renderUnits();
                    resetHighlights();
                    updateUI();
                } else {
                    setMessage("Du kannst dich maximal 1 Feld weit bewegen!");
                }
            }
        }

        function isAdjacentToPlayer(x, y) {
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) {
                        if (boardGrid[nx][ny].unit && boardGrid[nx][ny].unit.owner === 'player') return true;
                    }
                }
            }
            return false;
        }

        function highlightMoveFields(sx, sy) {
            resetHighlights();
            [[0,1], [0,-1], [1,0], [-1,0]].forEach(d => {
                const nx = sx + d[0], ny = sy + d[1];
                if (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) {
                    if (boardGrid[nx][ny].terrain !== TERRAIN.ROCK) {
                        boardMeshes[nx][ny].material.color.setHex(0x10b981);
                    }
                }
            });
        }

        function resetHighlights() {
            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    if (boardMeshes[x] && boardMeshes[x][y]) {
                        boardMeshes[x][y].material.color.setHex(boardGrid[x][y].terrain.color);
                    }
                }
            }
        }

        function selectCard(index) {
            if (selectedHandIndex === index) {
                selectedHandIndex = null;
                resetHighlights();
                setMessage("Karte abgewählt.");
            } else {
                selectedHandIndex = index;
                selectedFieldUnit = null;
                playSound('select');
                setMessage(`"${playerHand[index].name}" gewählt.`);
            }
            updateUI();
        }

        function endPlayerTurn() {
            if (!isPlayerTurn) return;
            isPlayerTurn = false;
            selectedHandIndex = null;
            selectedFieldUnit = null;
            resetHighlights();
            setMessage("Gegner ist am Zug...");
            updateUI();

            setTimeout(executeAITurn, 1000);
        }

        function executeAITurn() {
            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    const u = boardGrid[x][y].unit;
                    if (u && u.owner === 'enemy') {
                        if (y < 7 && !boardGrid[x][y+1].unit && boardGrid[x][y+1].terrain !== TERRAIN.ROCK) {
                            boardGrid[x][y+1].unit = u;
                            boardGrid[x][y].unit = null;
                            break;
                        }
                    }
                }
            }

            isPlayerTurn = true;
            playerSP = maxSP;
            resetTurnFlags(); // SPERREN FÜR SPIELER FÜR DEN NEUEN ZUG AUFHEBEN!
            renderUnits();
            updateUI();
            setMessage("Dein Zug! Deine Einheiten können wieder bewegt werden.");
        }

        function updateUI() {
            document.getElementById('player-lp').innerText = playerLP;
            document.getElementById('enemy-lp').innerText = enemyLP;
            document.getElementById('player-sp').innerText = `${playerSP}/${maxSP}`;
            document.getElementById('turn-indicator').innerText = isPlayerTurn ? "Dein Zug" : "Gegner am Zug";

            const container = document.getElementById('hand-container');
            container.innerHTML = '';

            playerHand.forEach((card, i) => {
                const cardEl = document.createElement('div');
                cardEl.className = `glass-card p-3 w-32 h-36 rounded-2xl cursor-pointer flex flex-col justify-between ${selectedHandIndex === i ? 'selected-card' : ''}`;
                cardEl.onclick = () => selectCard(i);
                cardEl.innerHTML = `
                    <div>
                        <span class="text-[9px] font-bold text-amber-400 uppercase tracking-wider block">${card.type}</span>
                        <h4 class="text-xs font-bold text-white mt-1 leading-tight">${card.name}</h4>
                    </div>
                    <div class="text-[10px] glass-panel p-1.5 rounded-xl border border-white/5">
                        <div class="flex justify-between text-emerald-400"><span>ATK</span><span class="font-bold">${card.atk}</span></div>
                        <div class="flex justify-between text-sky-400"><span>DEF</span><span class="font-bold">${card.def}</span></div>
                    </div>
                `;
                container.appendChild(cardEl);
            });
        }

        function setMessage(msg) {
            document.getElementById('game-message').innerText = msg;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(now) {
            requestAnimationFrame(animate);

            const interval = 1000 / targetFPS;
            const delta = now - lastFrameTime;

            if (delta >= interval) {
                lastFrameTime = now - (delta % interval);

                // QUALM PARTICLES ANIMATION
                smokeParticles.forEach(p => {
                    p.mesh.position.y += 0.005;
                    p.mesh.rotation.y += 0.01;
                    if (p.mesh.position.y > p.originY + 0.6) {
                        p.mesh.position.y = p.originY;
                    }
                });

                renderer.render(scene, camera);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
