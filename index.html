<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Monster RPG</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            border: 4px solid #4ade80;
            background-color: #0f172a;
            width: 640px;
            height: 480px;
            position: relative;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
            display: flex;
            flex-direction: column;
        }
        canvas {
            background-color: #86efac;
            display: block;
        }
        #ui {
            flex: 1;
            background-color: #1e293b;
            border-top: 4px solid #4ade80;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 14px;
        }
        .stats-box {
            display: flex;
            justify-content: space-between;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        button {
            background-color: #334155;
            color: #4ade80;
            border: 2px solid #4ade80;
            padding: 6px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }
        button:hover {
            background-color: #4ade80;
            color: #0f172a;
        }
        #text-log {
            height: 40px;
            overflow-y: auto;
            background: #0f172a;
            padding: 5px;
            border: 1px solid #334155;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="640" height="320"></canvas>
    <div id="ui">
        <div class="stats-box">
            <div id="player-status">Spieler Monster: -</div>
            <div id="enemy-status">Gegner: -</div>
        </div>
        <div id="text-log">Nutze die Pfeiltasten zum Bewegen. Geh ins hohe Gras (dunkelgrün), um Monster zu finden!</div>
