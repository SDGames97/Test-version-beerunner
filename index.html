<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wildnis Evolution 3D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Clean HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 18px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #level-display {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #exp-container {
            width: 120px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin-top: 6px;
            overflow: hidden;
        }

        #exp-bar {
            width: 0%;
            height: 100%;
            background: #4ade80;
            transition: width 0.2s ease-out;
        }

        #creature-name {
            font-size: 14px;
            color: #a7f3d0;
            margin-bottom: 2px;
        }

        /* Dynamic Joystick Overlay */
        #joystick-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }

        #joystick-base {
            position: absolute;
            width: 90px;
            height: 90px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: none;
        }

        #joystick-stick {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            top: 25px;
            left: 25px;
            pointer-events: none;
        }

        /* Notification Popup */
        #notification {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #facc15;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-panel">
            <div id="creature-name">Stufe 1: Larve</div>
            <div id="level-display">LVL 1 / 999</div>
            <div id="exp-container"><div id="exp-bar"></div></div>
        </div>
        <div class="hud-panel" style="font-size: 14px;">
            Wilde Wildnis 🌲
        </div>
    </div>

    <div id="notification">EVOLUTION!</div>

    <div id="joystick-zone">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- Three.js für 3D-Grafik -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- SPIEL-KONFIGURATION & STATE ---
        let level = 1;
        let exp = 0;
        let maxExp = 10;

        const evolutionaryStages = [
            { maxLvl: 50, name: "Larve", scale: 0.5, color: 0x84cc16 },
            { maxLvl: 150, name: "Raupe", scale: 0.9, color: 0x10b981 },
            { maxLvl: 300, name: "Käfer", scale: 1.4, color: 0x06b6d4 },
            { maxLvl: 500, name: "Fuchs", scale: 2.2, color: 0xf97316 },
            { maxLvl: 750, name: "Wolf", scale: 3.2, color: 0x64748b },
            { maxLvl: 999, name: "Urzeit-Bär", scale: 4.8, color: 0x78350f }
        ];

        function getStageInfo(lvl) {
            for (let stage of evolutionaryStages) {
                if (lvl <= stage.maxLvl) return stage;
            }
            return evolutionaryStages[evolutionaryStages.length - 1];
        }

        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Himmelsblau
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lichtquellen
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- WELT ERSTELLEN (Bäume, Berge, Beute) ---
        // Boden
        const groundGeo = new THREE.PlaneGeometry(300, 300, 32, 32);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x3b7a57, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Generiere Bäume & Steine
        const obstacles = [];
        const treeGeo = new THREE.ConeGeometry(2, 6, 5);
        const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 2, 5);
        const treeMat = new THREE.MeshStandardMaterial({ color: 0x1e4620 });
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });

        for (let i = 0; i < 80; i++) {
            const x = (Math.random() - 0.5) * 250;
            const z = (Math.random() - 0.5) * 250;
            if (Math.abs(x) < 5 && Math.abs(z) < 5) continue; // Startbereich freihalten

            const group = new THREE.Group();
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1;
            trunk.castShadow = true;
            group.add(trunk);

            const leaves = new THREE.Mesh(treeGeo, treeMat);
            leaves.position.y = 4;
            leaves.castShadow = true;
            group.add(leaves);

            group.position.set(x, 0, z);
            scene.add(group);
            obstacles.push({ x, z, radius: 1.5 });
        }

        // Beute-Objekte (andere Tiere/Nahrung in der Wildnis)
        const preys = [];
        const preyGeo = new THREE.SphereGeometry(0.8, 8, 8);

        function spawnPrey() {
            if (preys.length > 25) return;
            const mat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.4 });
            const prey = new THREE.Mesh(preyGeo, mat);
            prey.position.set(
                (Math.random() - 0.5) * 220,
                0.8,
                (Math.random() - 0.5) * 220
            );
            prey.castShadow = true;
            scene.add(prey);
            preys.push(prey);
        }

        for (let i = 0; i < 20; i++) spawnPrey();

        // --- SPIELER-FIGUR (LARVE / EVOLUTIONS-TIER) ---
        const currentStage = getStageInfo(level);
        const playerMat = new THREE.MeshStandardMaterial({ color: currentStage.color, roughness: 0.3 });
        const playerGeo = new THREE.SphereGeometry(1, 16, 16);
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 1, 0);
        player.castShadow = true;
        scene.add(player);

        // --- DYNAMISCHER TOUCH-JOYSTICK ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');

        let touchId = null;
        let startX = 0, startY = 0;
        let moveX = 0, moveY = 0;
        const maxDist = 40;

        joystickZone.addEventListener('pointerdown', (e) => {
            if (touchId !== null) return;
            touchId = e.pointerId;
            startX = e.clientX;
            startY = e.clientY;

            joystickBase.style.display = 'block';
            joystickBase.style.left = `${startX}px`;
            joystickBase.style.top = `${startY}px`;
            joystickStick.style.transform = `translate(0px, 0px)`;
            joystickZone.setPointerCapture(touchId);
        });

        joystickZone.addEventListener('pointermove', (e) => {
            if (e.pointerId !== touchId) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            const dist = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);

            const clampedDist = Math.min(dist, maxDist);
            moveX = Math.cos(angle) * (clampedDist / maxDist);
            moveY = Math.sin(angle) * (clampedDist / maxDist);

            joystickStick.style.transform = `translate(${Math.cos(angle) * clampedDist}px, ${Math.sin(angle) * clampedDist}px)`;
        });

        function resetJoystick(e) {
            if (e && e.pointerId !== touchId) return;
            touchId = null;
            moveX = 0;
            moveY = 0;
            joystickBase.style.display = 'none';
        }

        joystickZone.addEventListener('pointerup', resetJoystick);
        joystickZone.addEventListener('pointercancel', resetJoystick);

        // --- SPIEL-LOGIK & GAME LOOP ---
        const clock = new THREE.Clock();
        let playerVelocity = new THREE.Vector3();

        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.innerText = text;
            notif.style.opacity = '1';
            setTimeout(() => { notif.style.opacity = '0'; }, 1500);
        }

        function updateHUD() {
            const stage = getStageInfo(level);
            document.getElementById('creature-name').innerText = `Stufe ${level}: ${stage.name}`;
            document.getElementById('level-display').innerText = `LVL ${level} / 999`;
            document.getElementById('exp-bar').style.width = `${(exp / maxExp) * 100}%`;

            // Update Spieler-Modell visuell
            player.scale.setScalar(stage.scale);
            playerMat.color.setHex(stage.color);
        }

        function addExp(amount) {
            if (level >= 999) return;
            exp += amount;
            if (exp >= maxExp) {
                exp = 0;
                level++;
                maxExp = Math.floor(maxExp * 1.15);
                showNotification(`LEVEL UP! STUFE ${level}`);
                updateHUD();
            } else {
                updateHUD();
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();

            // Bewegungsberechnung
            const speed = 8 * Math.max(0.6, 2 / getStageInfo(level).scale);
            const targetVelX = moveX * speed;
            const targetVelZ = moveY * speed;

            player.position.x += targetVelX * dt;
            player.position.z += targetVelZ * dt;

            // Weltbegrenzung
            player.position.x = Math.max(-140, Math.min(140, player.position.x));
            player.position.z = Math.max(-140, Math.min(140, player.position.z));

            // Kollision mit Hindernissen (Bäumen)
            for (let obs of obstacles) {
                const dx = player.position.x - obs.x;
                const dz = player.position.z - obs.z;
                const dist = Math.hypot(dx, dz);
                const currentRadius = getStageInfo(level).scale * 0.8 + obs.radius;
                if (dist < currentRadius) {
                    player.position.x -= (dx / dist) * (currentRadius - dist);
                    player.position.z -= (dz / dist) * (currentRadius - dist);
                }
            }

            // Kollision mit Beute / anderen Tieren (Schaden zufügen & fressen)
            for (let i = preys.length - 1; i >= 0; i--) {
                const prey = preys[i];
                const dist = player.position.distanceTo(prey.position);
                const eatRange = getStageInfo(level).scale * 0.8 + 0.8;

                if (dist < eatRange) {
                    scene.remove(prey);
                    preys.splice(i, 1);
                    addExp(3);
                    spawnPrey();
                }
            }

            // Kamera-Verfolgung (sanft)
            const stageScale = getStageInfo(level).scale;
            const targetCamPos = new THREE.Vector3(
                player.position.x,
                player.position.y + 5 + stageScale * 1.5,
                player.position.z + 8 + stageScale * 2.5
            );
            camera.position.lerp(targetCamPos, 0.1);
            camera.lookAt(player.position.x, player.position.y, player.position.z);

            renderer.render(scene, camera);
        }

        // Responsives Fenster
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        updateHUD();
        animate();
    </script>
</body>
</html>
