<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>WormRing 3D</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Firebase SDKs via CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body class="bg-sky-200">

  <!-- 3D Spiel Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Dynamischer Touch-Joystick Overlay -->
  <div id="joystick-container" class="absolute pointer-events-none hidden" style="transform: translate(-50%, -50%); z-index: 10;">
    <div id="joystick-base" class="w-24 h-24 rounded-full bg-white/30 border-2 border-white/60 backdrop-blur-md flex items-center justify-center relative shadow-lg">
      <div id="joystick-stick" class="w-10 h-10 rounded-full bg-amber-400 border-2 border-white shadow-md transition-transform duration-75"></div>
    </div>
  </div>

  <!-- HUD Overlay (Punkte & Länge) -->
  <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none hidden z-10">
    <div class="bg-white/80 backdrop-blur-md px-4 py-2 rounded-2xl shadow-md border border-white/50 text-slate-800 font-bold text-lg">
      🍎 Punkte: <span id="score-val" class="text-emerald-600">0</span>
    </div>
    <div class="bg-white/80 backdrop-blur-md px-4 py-2 rounded-2xl shadow-md border border-white/50 text-slate-800 font-bold text-sm">
      🐍 Länge: <span id="length-val" class="text-amber-600">5</span>
    </div>
  </div>

  <!-- Startmenü & Leaderboard -->
  <div id="start-menu" class="absolute inset-0 bg-gradient-to-b from-sky-400/90 via-sky-300/90 to-emerald-300/90 backdrop-blur-md flex items-center justify-center p-4 z-20">
    <div class="bg-white/95 p-6 md:p-8 rounded-3xl shadow-2xl border-4 border-amber-300 max-w-md w-full text-center">
      <h1 class="text-4xl font-extrabold text-amber-500 drop-shadow-sm mb-1 tracking-wide">🐛 WormRing 3D</h1>
      <p class="text-slate-500 text-sm mb-6 font-medium">Sammle Futter, wachse und erklimme die Rangliste!</p>
      
      <div class="mb-5 text-left">
        <label for="player-name" class="block text-xs font-bold text-slate-600 uppercase mb-2">Dein Spielername</label>
        <input type="text" id="player-name" placeholder="WurmChampion" maxlength="15" class="w-full px-4 py-3 bg-slate-100 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-amber-400 text-slate-800 font-bold text-lg transition">
      </div>

      <button id="start-btn" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-black text-xl rounded-2xl shadow-lg transition duration-150 transform mb-6">
        SPIEL STARTEN ▶
      </button>

      <!-- Leaderboard Liste -->
      <div class="border-t border-slate-200 pt-4 text-left">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-bold text-slate-700 uppercase flex items-center gap-1">🏆 Online Highscores</h2>
          <span id="lb-status" class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-bold">Verbunden</span>
        </div>
        <div class="bg-slate-50 rounded-2xl p-3 border border-slate-200 max-h-48 overflow-y-auto">
          <ol id="leaderboard-list" class="text-sm font-semibold text-slate-600 divide-y divide-slate-100">
            <li class="py-2 text-center text-slate-400 italic">Lade Bestenliste...</li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-menu" class="absolute inset-0 bg-rose-950/60 backdrop-blur-md flex items-center justify-center p-4 z-30 hidden">
    <div class="bg-white/95 p-6 md:p-8 rounded-3xl shadow-2xl border-4 border-rose-300 max-w-sm w-full text-center transform scale-100 transition">
      <div class="text-5xl mb-2">💥</div>
      <h2 class="text-3xl font-black text-rose-500 mb-2">Game Over!</h2>
      <p class="text-slate-600 font-medium mb-4">Du bist zusammengestoßen.</p>
      
      <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-6">
        <div class="text-xs text-amber-700 font-bold uppercase mb-1">Erreichte Punkte</div>
        <div id="final-score" class="text-4xl font-extrabold text-amber-500">0</div>
      </div>

      <button id="restart-btn" class="w-full py-4 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-black text-xl rounded-2xl shadow-lg transition duration-150 transform">
        NOCHMAL SPIELEN 🔄
      </button>
    </div>
  </div>

  <script>
    // ==========================================
    // FIREBASE KONFIGURATION (wormring-16620)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDK77MSnstrk4Q3XW0-Pd7LEMCQuRd1NjM",
      authDomain: "wormring-16620.firebaseapp.com",
      projectId: "wormring-16620",
      storageBucket: "wormring-16620.firebasestorage.app",
      messagingSenderId: "1066548218415",
      appId: "1:1066548218415:web:25358a6ab6cda5ce11d4da",
      measurementId: "G-QQ0CSTRFR9"
    };

    let db = null;
    let isFirebaseActive = false;

    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        isFirebaseActive = true;
      }
    } catch(e) {
      console.warn("Firebase Init Hinweis:", e);
    }

    // ==========================================
    // AUDIO SYNTHESIZER (Web Audio API)
    // ==========================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playPopSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch(e){}
    }

    function playHitSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch(e){}
    }

    // ==========================================
    // LEADERBOARD LOGIK
    // ==========================================
    const lbStatusEl = document.getElementById('lb-status');
    const lbListEl = document.getElementById('leaderboard-list');

    function updateLBStatus(online) {
      if (online) {
        lbStatusEl.textContent = "Online Cloud";
        lbStatusEl.className = "text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-bold";
      } else {
        lbStatusEl.textContent = "Lokal (Offline)";
        lbStatusEl.className = "text-[10px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 font-bold";
      }
    }

    function loadLeaderboard() {
      if (isFirebaseActive && db) {
        db.collection("leaderboard")
          .orderBy("score", "desc")
          .limit(10)
          .onSnapshot((snapshot) => {
            updateLBStatus(true);
            const scores = [];
            snapshot.forEach(doc => scores.push(doc.data()));
            renderLeaderboardUI(scores);
          }, (err) => {
            console.warn("Firestore Hinweis, Fallback auf lokal:", err);
            loadLocalLeaderboard();
          });
      } else {
        loadLocalLeaderboard();
      }
    }

    function loadLocalLeaderboard() {
      updateLBStatus(false);
      const local = JSON.parse(localStorage.getItem('worm_scores') || '[]');
      renderLeaderboardUI(local);
    }

    function renderLeaderboardUI(scores) {
      lbListEl.innerHTML = '';
      if (!scores || scores.length === 0) {
        lbListEl.innerHTML = '<li class="py-2 text-center text-slate-400 italic">Noch keine Highscores vorhanden</li>';
        return;
      }
      scores.slice(0, 10).forEach((entry, idx) => {
        const li = document.createElement('li');
        li.className = "py-2 flex justify-between items-center text-sm font-semibold";
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
        li.innerHTML = `
          <span class="flex items-center gap-2">
            <span class="w-6 text-center font-bold text-slate-400">${medal}</span>
            <span class="text-slate-800">${escapeHtml(entry.name || 'Anonym')}</span>
          </span>
          <span class="text-amber-600 font-black">${Math.floor(entry.score || 0)}</span>
        `;
        lbListEl.appendChild(li);
      });
    }

    async function saveScore(name, score) {
      const cleanScore = Math.floor(score);
      const cleanName = name.trim() || 'WurmPlayer';

      const local = JSON.parse(localStorage.getItem('worm_scores') || '[]');
      local.push({ name: cleanName, score: cleanScore, date: new Date().toISOString() });
      local.sort((a,b) => b.score - a.score);
      localStorage.setItem('worm_scores', JSON.stringify(local.slice(0, 20)));

      if (isFirebaseActive && db) {
        try {
          await db.collection("leaderboard").add({
            name: cleanName,
            score: cleanScore,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch(e) {
          console.error("Fehler beim Speichern:", e);
        }
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    const nameInput = document.getElementById('player-name');
    nameInput.value = localStorage.getItem('worm_player_name') || 'Wurm' + Math.floor(Math.random()*1000);

    // ==========================================
    // THREE.JS & SPIEL ENGINES
    // ==========================================
    const canvas = document.getElementById('game-canvas');
    let renderer, scene, camera;
    let isPlaying = false;
    let animationFrameId = null;

    const SPEED = 0.07; // 70% Entschleunigung
    const SEGMENT_DISTANCE = 0.45;
    const MAX_BEND_ANGLE = 0.35; // Starre Körperphysik
    const ARENA_SIZE = 40;

    let player;
    let bots = [];
    let foods = [];

    const COLORS = [0xff595e, 0xffca3a, 0x8ac926, 0x1982c4, 0x6a4c93, 0xff924c];

    function initThree() {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xbae6fd);
      scene.fog = new THREE.FogExp2(0xbae6fd, 0.02);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 18, 14);
      camera.lookAt(0, 0, 0);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(20, 40, 20);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const groundGeo = new THREE.PlaneGeometry(ARENA_SIZE * 2, ARENA_SIZE * 2);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x86efac, roughness: 0.8 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const grid = new THREE.GridHelper(ARENA_SIZE * 2, 40, 0x4ade80, 0xbbf7d0);
      grid.position.y = 0.01;
      scene.add(grid);

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // WURM KLASSE
    class Worm {
      constructor(isPlayer = false, color = 0xff595e, startX = 0, startZ = 0) {
        this.isPlayer = isPlayer;
        this.color = color;
        this.score = 0;
        this.dir = Math.random() * Math.PI * 2;
        this.targetDir = this.dir;
        this.isDead = false;

        this.segments = [];
        this.meshGroup = new THREE.Group();
        scene.add(this.meshGroup);

        const headMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });

        const headGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const headMesh = new THREE.Mesh(headGeo, headMat);
        headMesh.castShadow = true;
        headMesh.position.set(startX, 0.5, startZ);
        this.meshGroup.add(headMesh);
        this.segments.push(headMesh);

        // Augen
        const eyeGeo = new THREE.SphereGeometry(0.12, 8, 8);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

        const eyeLeft = new THREE.Mesh(eyeGeo, eyeMat);
        eyeLeft.position.set(-0.2, 0.25, 0.3);
        headMesh.add(eyeLeft);
        const pupilLeft = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), pupilMat);
        pupilLeft.position.set(0, 0, 0.08);
        eyeLeft.add(pupilLeft);

        const eyeRight = new THREE.Mesh(eyeGeo, eyeMat);
        eyeRight.position.set(0.2, 0.25, 0.3);
        headMesh.add(eyeRight);
        const pupilRight = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), pupilMat);
        pupilRight.position.set(0, 0, 0.08);
        eyeRight.add(pupilRight);

        // Start-Segmente
        for (let i = 0; i < 6; i++) {
          this.addSegment(startX - (i + 1) * SEGMENT_DISTANCE * Math.sin(this.dir), startZ - (i + 1) * SEGMENT_DISTANCE * Math.cos(this.dir));
        }
      }

      addSegment(x, z) {
        const scale = Math.max(0.25, 0.45 - this.segments.length * 0.005);
        const bodyGeo = new THREE.SphereGeometry(scale, 12, 12);
        const bodyMat = new THREE.MeshStandardMaterial({ color: this.color, roughness: 0.4 });
        const mesh = new THREE.Mesh(bodyGeo, bodyMat);
        mesh.castShadow = true;
        mesh.position.set(x, scale, z);
        this.meshGroup.add(mesh);
        this.segments.push(mesh);
      }

      update() {
        if (this.isDead) return;

        let diff = this.targetDir - this.dir;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.dir += diff * 0.1;

        const head = this.segments[0];
        head.position.x += Math.sin(this.dir) * SPEED;
        head.position.z += Math.cos(this.dir) * SPEED;
        head.rotation.y = this.dir;

        if (Math.abs(head.position.x) > ARENA_SIZE || Math.abs(head.position.z) > ARENA_SIZE) {
          this.die();
          return;
        }

        // Körperphysik mit maximalem Biegewinkel
        for (let i = 1; i < this.segments.length; i++) {
          const prev = this.segments[i - 1];
          const curr = this.segments[i];

          const dx = curr.position.x - prev.position.x;
          const dz = curr.position.z - prev.position.z;
          const dist = Math.sqrt(dx * dx + dz * dz);

          if (dist > SEGMENT_DISTANCE) {
            let angle = Math.atan2(dx, dz);
            
            if (i > 1) {
              const pPrev = this.segments[i - 2];
              const pAngle = Math.atan2(prev.position.x - pPrev.position.x, prev.position.z - pPrev.position.z);
              let angleDiff = angle - pAngle;
              while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
              while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
              angleDiff = Math.max(-MAX_BEND_ANGLE, Math.min(MAX_BEND_ANGLE, angleDiff));
              angle = pAngle + angleDiff;
            }

            curr.position.x = prev.position.x + Math.sin(angle) * SEGMENT_DISTANCE;
            curr.position.z = prev.position.z + Math.cos(angle) * SEGMENT_DISTANCE;
          }
        }
      }

      die() {
        if (this.isDead) return;
        this.isDead = true;

        this.segments.forEach(seg => {
          spawnFood(seg.position.x, seg.position.z);
        });

        scene.remove(this.meshGroup);

        if (this.isPlayer) {
          playHitSound();
          onGameOver(this.score);
        }
      }
    }

    // SPATIAL FUTTER SPANNING
    function spawnFood(x = null, z = null) {
      const foodGeo = new THREE.DodecahedronGeometry(0.25);
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      const foodMat = new THREE.MeshStandardMaterial({
        color: color,
        roughness: 0.2,
        emissive: color,
        emissiveIntensity: 0.3
      });
      const mesh = new THREE.Mesh(foodGeo, foodMat);
      mesh.castShadow = true;

      const px = x !== null ? x : (Math.random() - 0.5) * (ARENA_SIZE * 1.8);
      const pz = z !== null ? z : (Math.random() - 0.5) * (ARENA_SIZE * 1.8);

      mesh.position.set(px, 0.3, pz);
      scene.add(mesh);
      foods.push(mesh);
    }

    // JOYSTICK STEUERUNG
    const joystickContainer = document.getElementById('joystick-container');
    const joystickStick = document.getElementById('joystick-stick');

    let touchActive = false;
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      if (!isPlaying) return;
      if (e.clientY < 60 && e.clientX < 150) return;

      initAudio();
      touchActive = true;
      touchStartX = e.clientX;
      touchStartY = e.clientY;

      joystickContainer.style.left = `${touchStartX}px`;
      joystickContainer.style.top = `${touchStartY}px`;
      joystickContainer.classList.remove('hidden');
      joystickStick.style.transform = `translate(0px, 0px)`;
    });

    window.addEventListener('pointermove', (e) => {
      if (!touchActive || !player || player.isDead) return;

      const dx = e.clientX - touchStartX;
      const dy = e.clientY - touchStartY;
      const maxRadius = 40;
      const dist = Math.min(maxRadius, Math.sqrt(dx * dx + dy * dy));

      if (dist > 5) {
        const angle = Math.atan2(dx, dy);
        player.targetDir = angle;

        const moveX = Math.sin(angle) * dist;
        const moveY = Math.cos(angle) * dist;
        joystickStick.style.transform = `translate(${moveX}px, ${moveY}px)`;
      }
    });

    window.addEventListener('pointerup', () => {
      touchActive = false;
      joystickContainer.classList.add('hidden');
    });

    // GAME ANIMATION LOOP
    function animate() {
      if (!isPlaying) return;

      animationFrameId = requestAnimationFrame(animate);

      if (player && !player.isDead) {
        player.update();

        const head = player.segments[0];
        camera.position.x = head.position.x;
        camera.position.z = head.position.z + 14;
        camera.lookAt(head.position.x, 0, head.position.z);

        // Futter fressen
        for (let i = foods.length - 1; i >= 0; i--) {
          const f = foods[i];
          if (head.position.distanceTo(f.position) < 0.8) {
            scene.remove(f);
            foods.splice(i, 1);
            player.score += 10;
            playPopSound();

            if (player.score % 30 === 0) {
              const tail = player.segments[player.segments.length - 1];
              player.addSegment(tail.position.x, tail.position.z);
            }

            document.getElementById('score-val').textContent = player.score;
            document.getElementById('length-val').textContent = player.segments.length;
            spawnFood();
          }
        }

        // Kollision mit Bots
        bots.forEach(bot => {
          if (bot.isDead) return;
          for (let i = 0; i < bot.segments.length; i++) {
            if (head.position.distanceTo(bot.segments[i].position) < 0.6) {
              player.die();
              break;
            }
          }
          const botHead = bot.segments[0];
          for (let i = 0; i < player.segments.length; i++) {
            if (botHead.position.distanceTo(player.segments[i].position) < 0.6) {
              bot.die();
              break;
            }
          }
        });
      }

      // Bots Update
      bots.forEach(bot => {
        if (bot.isDead) return;

        if (Math.random() < 0.02) bot.targetDir += (Math.random() - 0.5) * 1.5;
        const bHead = bot.segments[0];
        if (Math.abs(bHead.position.x) > ARENA_SIZE - 3 || Math.abs(bHead.position.z) > ARENA_SIZE - 3) {
          bot.targetDir = Math.atan2(-bHead.position.x, -bHead.position.z);
        }

        bot.update();

        for (let i = foods.length - 1; i >= 0; i--) {
          if (bHead.position.distanceTo(foods[i].position) < 0.8) {
            scene.remove(foods[i]);
            foods.splice(i, 1);
            bot.score += 10;
            if (bot.score % 40 === 0) {
              const tail = bot.segments[bot.segments.length - 1];
              bot.addSegment(tail.position.x, tail.position.z);
            }
            spawnFood();
          }
        }
      });

      bots = bots.filter(b => !b.isDead);
      while (bots.length < 6) {
        const bx = (Math.random() - 0.5) * (ARENA_SIZE * 1.5);
        const bz = (Math.random() - 0.5) * (ARENA_SIZE * 1.5);
        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
        bots.push(new Worm(false, color, bx, bz));
      }

      const time = Date.now() * 0.003;
      foods.forEach((f, idx) => {
        f.position.y = 0.3 + Math.sin(time + idx) * 0.08;
        f.rotation.y += 0.02;
      });

      renderer.render(scene, camera);
    }

    // SPIEL START & OVER
    function startGame() {
      const name = nameInput.value.trim() || 'WurmPlayer';
      localStorage.setItem('worm_player_name', name);

      if (player) scene.remove(player.meshGroup);
      bots.forEach(b => scene.remove(b.meshGroup));
      foods.forEach(f => scene.remove(f));

      bots = [];
      foods = [];

      player = new Worm(true, 0xffca3a, 0, 0);

      for (let i = 0; i < 50; i++) spawnFood();
      for (let i = 0; i < 6; i++) {
        const bx = (Math.random() - 0.5) * (ARENA_SIZE * 1.5);
        const bz = (Math.random() - 0.5) * (ARENA_SIZE * 1.5);
        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
        bots.push(new Worm(false, color, bx, bz));
      }

      document.getElementById('score-val').textContent = '0';
      document.getElementById('length-val').textContent = player.segments.length;

      document.getElementById('start-menu').classList.add('hidden');
      document.getElementById('gameover-menu').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');

      isPlaying = true;
      animate();
    }

    function onGameOver(score) {
      isPlaying = false;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);

      document.getElementById('hud').classList.add('hidden');
      document.getElementById('final-score').textContent = Math.floor(score);
      document.getElementById('gameover-menu').classList.remove('hidden');

      const pName = nameInput.value.trim() || 'WurmPlayer';
      saveScore(pName, score);
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      initAudio();
      startGame();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      initAudio();
      loadLeaderboard();
      document.getElementById('gameover-menu').classList.add('hidden');
      document.getElementById('start-menu').classList.remove('hidden');
    });

    initThree();
    loadLeaderboard();
  </script>
</body>
</html>
