<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>WormRing 3D</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Firebase SDKs via CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body class="bg-sky-200">

  <!-- 3D Spiel Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Dynamischer Touch-Joystick Overlay -->
  <div id="joystick-container" class="absolute pointer-events-none hidden" style="transform: translate(-50%, -50%); z-index: 10;">
    <div id="joystick-base" class="w-24 h-24 rounded-full bg-white/30 border-2 border-white/60 backdrop-blur-md flex items-center justify-center relative shadow-lg">
      <div id="joystick-stick" class="w-10 h-10 rounded-full bg-amber-400 border-2 border-white shadow-md transition-transform duration-75"></div>
    </div>
  </div>

  <!-- HUD Overlay (Punkte & Länge) -->
  <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none hidden z-10">
    <div class="bg-white/80 backdrop-blur-md px-4 py-2 rounded-2xl shadow-md border border-white/50 text-slate-800 font-bold text-lg">
      🍎 Punkte: <span id="score-val" class="text-emerald-600">0</span>
    </div>
    <div class="bg-white/80 backdrop-blur-md px-4 py-2 rounded-2xl shadow-md border border-white/50 text-slate-800 font-bold text-sm">
      🐍 Länge: <span id="length-val" class="text-amber-600">5</span>
    </div>
  </div>

  <!-- Startmenü & Leaderboard -->
  <div id="start-menu" class="absolute inset-0 bg-gradient-to-b from-sky-400/90 via-sky-300/90 to-emerald-300/90 backdrop-blur-md flex items-center justify-center p-4 z-20">
    <div class="bg-white/95 p-6 md:p-8 rounded-3xl shadow-2xl border-4 border-amber-300 max-w-md w-full text-center">
      <h1 class="text-4xl font-extrabold text-amber-500 drop-shadow-sm mb-1 tracking-wide">🐛 WormRing 3D</h1>
      <p class="text-slate-500 text-sm mb-6 font-medium">Sammle Futter, wachse und erklimme die Rangliste!</p>
      
      <div class="mb-5 text-left">
        <label for="player-name" class="block text-xs font-bold text-slate-600 uppercase mb-2">Dein Spielername</label>
        <input type="text" id="player-name" placeholder="WurmChampion" maxlength="15" class="w-full px-4 py-3 bg-slate-100 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-amber-400 text-slate-800 font-bold text-lg transition">
      </div>

      <button id="start-btn" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-black text-xl rounded-2xl shadow-lg transition duration-150 transform mb-6">
        SPIEL STARTEN ▶
      </button>

      <!-- Leaderboard Liste -->
      <div class="border-t border-slate-200 pt-4 text-left">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-bold text-slate-700 uppercase flex items-center gap-1">
