<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bee Runner 3D</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bee Runner">
  
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #87CEEB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 10;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .score-container {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 20px;
      color: #FFF;
      font-weight: 800;
      font-size: 24px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    #shield-ui {
      display: none;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      padding: 8px 15px;
      border-radius: 20px;
      border: 2px solid #00d2ff;
    }
    .shield-bar-bg {
      width: 100px;
      height: 12px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      overflow: hidden;
      margin-right: 10px;
    }
    #shield-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #00d2ff, #0072ff);
      border-radius: 6px;
    }
    #shield-text {
      color: #00d2ff;
      font-weight: 800;
      font-size: 16px;
      min-width: 35px;
    }
    .floating-text {
      position: absolute;
      color: #FFD700;
      font-size: 32px;
      font-weight: 900;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      z-index: 20;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
      50% { transform: translate(-50%, -100%) scale(1.3); }
      100% { opacity: 0; transform: translate(-50%, -150%) scale(1); }
